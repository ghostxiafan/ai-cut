[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aicut"
version = "0.1.0"
description = "AI 辅助剪辑：内容理解 -> 时间线 IR -> 可插拔渲染后端（FFmpeg / 剪映草稿）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
aicut = "aicut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", "out", ".venv"]
